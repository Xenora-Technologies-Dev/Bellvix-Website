<!doctype html>
<html lang="en-AE" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--app-head-->
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="author" href="/humans.txt" />
    <link rel="alternate" type="application/rss+xml" title="Bellvix Insights (RSS)" href="/insights/rss.xml" />
    <link rel="alternate" type="application/atom+xml" title="Bellvix Insights (Atom)" href="/insights/atom.xml" />
    <link rel="alternate" type="text/plain" title="LLM index" href="/llms.txt" />
    <!--app-preload-->
    <!--verification-->
    <!--analytics-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!-- Static copies of the site forms so Netlify Forms detects them at deploy time. Not visible. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" /><input name="email" /><input name="company" /><input name="phone" />
      <input name="topic" /><textarea name="message"></textarea><input name="page" />
    </form>
    <form name="demo" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="demo" />
      <input name="bot-field" />
      <input name="name" /><input name="email" /><input name="company" /><input name="phone" />
      <input name="edition" /><input name="modules" /><textarea name="message"></textarea><input name="page" />
    </form>
    <form name="chat-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="chat-lead" />
      <input name="bot-field" />
      <input name="name" /><input name="phone" /><input name="email" /><input name="company" />
      <input name="interest" /><textarea name="message"></textarea><input name="page" /><textarea name="transcript"></textarea>
    </form>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
